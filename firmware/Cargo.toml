[package]
name = "ulanzi-pomodoro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pomodoro firmware for the Ulanzi TC001 pixel clock (ESP32)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ulanzi-pomodoro"
path = "src/main.rs"

[dependencies]
blocking-network-stack = { git = "https://github.com/bjoernQ/blocking-network-stack.git", rev = "b3ecefc", features = ["udp", "dns"] }
embedded-graphics = { version = "0.8", default-features = false }
embedded-hal = "1.0.0"
embedded-io = { version = "0.6.1", default-features = false }
embedded-storage = "0.3"
esp-alloc = "0.9.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-hal = { version = "1.0.0", features = ["esp32", "unstable", "log-04"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-radio = { version = "0.17.0", features = ["esp32", "wifi", "smoltcp", "log-04", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "esp-radio", "log-04"] }
esp-storage = { version = "0.8.1", features = ["esp32"] }
nb = "1.1.0"
smoltcp = { version = "0.12.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "proto-dns",
    "socket-dhcpv4",
    "socket-dns",
    "socket-udp",
] }

[profile.dev]
# Cargo dev builds are too slow to actually flash to the device.
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false
